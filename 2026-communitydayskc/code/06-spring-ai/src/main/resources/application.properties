spring.application.name=spring-ai-fraud-explainer
server.port=8006

# ── OpenAI (default provider) ───────────────────────────────────────────────
# Set via env var: export OPENAI_API_KEY=sk-...
spring.ai.openai.api-key=${OPENAI_API_KEY:demo-key}
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.temperature=0.2

# ── Switch to Anthropic Claude — swap the starter in pom.xml and uncomment: ─
# spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY}
# spring.ai.anthropic.chat.options.model=claude-3-5-sonnet-20241022
# spring.ai.anthropic.chat.options.temperature=0.2

# ── Switch to local Ollama (zero cost, no API key) — uncomment: ─────────────
# spring.ai.ollama.base-url=http://localhost:11434
# spring.ai.ollama.chat.options.model=llama3.1

logging.level.org.springframework.ai=INFO
