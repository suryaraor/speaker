# ─────────────────────────────────────────────────────────────────────────────
# Full ML Pipeline — Docker Compose
# Starts: Zookeeper, Kafka, Python ML service, Java pipeline app
#
# Usage:
#   docker-compose up --build          # start everything
#   docker-compose down -v             # stop and remove volumes
#
# After startup:
#   Produce a test transaction:
#   docker-compose exec kafka kafka-console-producer.sh \
#     --broker-list localhost:9092 --topic transactions
#   (paste JSON and press Enter)
#
#   View fraud alerts:
#   curl http://localhost:8084/api/pipeline/alerts
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Kafka infrastructure ────────────────────────────────────────────────────

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka:29092"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Python ML Service ────────────────────────────────────────────────────────

  ml-service:
    build:
      context: ./python-ml-service
      dockerfile: Dockerfile
    container_name: ml-service
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Java Pipeline ────────────────────────────────────────────────────────────

  java-pipeline:
    build:
      context: ./java-pipeline
      dockerfile: Dockerfile
    container_name: java-pipeline
    depends_on:
      kafka:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    ports:
      - "8084:8084"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ML_SERVICE_URL: http://ml-service:8000

  # ── Kafka UI (optional — useful for demos) ────────────────────────────────────

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "9090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
