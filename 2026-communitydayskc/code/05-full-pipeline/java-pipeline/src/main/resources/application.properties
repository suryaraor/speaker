spring.application.name=full-pipeline
server.port=8084

# Kafka
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=fraud-pipeline
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.pipeline.model
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Kafka topics
kafka.topic.transactions=transactions

# ONNX model (optional — falls back to REST if not present)
onnx.model.path=src/main/resources/models/fraud_model.onnx

# Python ML service (used when ONNX is unavailable)
ml.service.url=${ML_SERVICE_URL:http://localhost:8000}

# Logging
logging.level.com.example=DEBUG

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
